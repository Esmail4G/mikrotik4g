name: Build APK from uploaded source ZIP

on:
  push:
    paths:
      - "mikrotik4g-source.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded source
        run: |
          test -f mikrotik4g-source.zip
          unzip -q mikrotik4g-source.zip
          test -f mikrotik4g/package.json
          test -f mikrotik4g/pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mikrotik4g
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: mikrotik4g
        run: pnpm lint

      - name: Type-check
        working-directory: mikrotik4g
        run: pnpm check

      - name: Unit tests
        working-directory: mikrotik4g
        run: pnpm test

      - name: Export web preview
        working-directory: mikrotik4g
        run: pnpm exec expo export --platform web --output-dir /tmp/mikrotik4g-web-ci

      - name: Generate Android project
        working-directory: mikrotik4g
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: mikrotik4g/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mikro-tik-4g-debug-apk
          path: mikrotik4g/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
